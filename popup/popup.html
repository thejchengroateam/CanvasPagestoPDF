<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas to PDF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <h1 class="title">Canvas to PDF</h1>
      <p class="subtitle">Extract clean content without Canvas UI</p>
    </header>

    <div class="page-meta" id="page-meta">
      <div id="page-title-preview" class="truncate">Checking active tab...</div>
    </div>

    <div id="theme-warning" class="theme-warning hidden">
      <span><strong>Custom Theme Active:</strong> Retaining custom theme in PDF.</span>
    </div>

    <button id="btn-convert" class="btn-primary">
      <svg class="btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span id="btn-text">View PDF</span>
    </button>

    <div id="status-msg" class="status-msg hidden"></div>

    <button id="btn-open-info" class="btn-secondary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span>About</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
