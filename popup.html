<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas to PDF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header class="header">
      <img src="icons/icon48.png" alt="Canvas to PDF logo" class="logo-img" width="36" height="36">
      <div>
        <h1 class="title">Canvas to PDF</h1>
        <p class="subtitle">Extract clean content without Canvas UI</p>
      </div>
    </header>

    <div class="page-meta" id="page-meta">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span id="page-title-preview" class="truncate">Checking active tab...</span>
      </div>
    </div>

    <div id="theme-warning" class="theme-warning hidden">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <span><strong>Custom Theme Active:</strong> A custom theme or dark mode (e.g. BetterCanvas) was detected. The PDF will reflect these custom colors & background.</span>
    </div>

    <button id="btn-convert" class="btn-primary">
      <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span id="btn-text">Download PDF</span>
    </button>

    <div id="status-msg" class="status-msg hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
